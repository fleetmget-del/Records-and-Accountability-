<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barangay Vehicle Accountability</title><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one working column. A title bar, a row of tabs (one per document type),
   then either a records table, an entry form, or a paper preview of the document. */
:root {
  --bg: #EDF1EF;
  --surface: #FFFFFF;
  --surface-2: #F5F8F6;
  --ink: #14211C;
  --muted: #586A63;
  --line: #D3DCD8;
  --accent: #17624A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEDE5;
  --plate-bg: #FFFFFF;
  --plate-ink: #B3261E;
  --ok: #1B6E40;
  --ok-soft: #D9F0E2;
  --warn: #8A5200;
  --warn-soft: #FBEBCB;
  --bad: #A8231C;
  --bad-soft: #F9DEDC;
  --paper: #FFFFFF;
  --paper-ink: #111111;
  --shadow: 0 1px 2px rgba(20, 33, 28, .08), 0 6px 20px rgba(20, 33, 28, .06);
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #171F1C; --surface-2: #1E2824; --ink: #E5ECE9; --muted: #9AABA4;
    --line: #2D3A35; --accent: #5CC29B; --accent-ink: #06231A; --accent-soft: #1C392F;
    --plate-bg: #F4F4F1; --plate-ink: #B3261E;
    --ok: #74D6A0; --ok-soft: #173526; --warn: #F0C36A; --warn-soft: #3A2D10; --bad: #FF9389; --bad-soft: #40201D;
    --paper: #FFFFFF; --paper-ink: #111111;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #171F1C; --surface-2: #1E2824; --ink: #E5ECE9; --muted: #9AABA4;
  --line: #2D3A35; --accent: #5CC29B; --accent-ink: #06231A; --accent-soft: #1C392F;
  --plate-bg: #F4F4F1; --plate-ink: #B3261E;
  --ok: #74D6A0; --ok-soft: #173526; --warn: #F0C36A; --warn-soft: #3A2D10; --bad: #FF9389; --bad-soft: #40201D;
  --paper: #FFFFFF; --paper-ink: #111111;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: .98rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

.top { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: flex-end; justify-content: space-between; }
.top .who { color: var(--muted); font-size: .9rem; }
.store { font-size: .8rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.store i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.store.local i { background: var(--warn); }

.tabs-scroll { overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; min-width: max-content; }
.tab { font: 600 .92rem var(--body); color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .n { font: 500 .75rem var(--mono); color: var(--muted); margin-left: 6px; }

button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.quiet:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn[disabled] { opacity: .55; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 200px; min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.panel-head { padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.panel-body { padding: 16px; }

.stats { display: flex; flex-wrap: wrap; gap: 6px 28px; }
.stat { display: flex; align-items: baseline; gap: 8px; }
.stat b { font: 700 1.35rem var(--display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .88rem; }

.table-wrap { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.list th { text-align: left; font: 600 .72rem var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tr:last-child td { border-bottom: 0; }
table.list td.act { white-space: nowrap; text-align: right; }
table.list .sub { color: var(--muted); font-size: .82rem; }
.num { font-family: var(--mono); font-size: .84rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.plate { display: inline-block; font: 600 .86rem var(--mono); letter-spacing: .08em; color: var(--plate-ink); background: var(--plate-bg); border: 1.5px solid var(--plate-ink); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
.plate.none { color: var(--muted); border-color: var(--line); background: transparent; letter-spacing: 0; font-family: var(--body); font-weight: 500; }
.pill { display: inline-block; font-size: .76rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

.empty { padding: 28px 16px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.steps { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }
.steps b { font-weight: 600; }

form.entry { display: flex; flex-direction: column; gap: 18px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
legend { font: 600 .98rem var(--display); padding: 0; margin-bottom: 2px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: .8rem; font-weight: 600; color: var(--muted); }
.fld .req { font-weight: 500; color: var(--bad); font-size: .72rem; margin-left: 4px; }
.fld small { color: var(--muted); font-size: .76rem; }
.fld.wide { grid-column: 1 / -1; }
input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
.checks { display: grid; gap: 8px; }
.check { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(120px, .8fr) minmax(0, 1.4fr); gap: 8px; align-items: center; }
.check > span { font-size: .9rem; }
@media (max-width: 620px) { .check { grid-template-columns: 1fr; gap: 4px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); } }
.note { background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; padding: 10px 12px; font-size: .88rem; max-width: 80ch; }
.note.warn { border-left-color: var(--warn); }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 10px 12px; font-size: .9rem; font-weight: 500; }

.paper-wrap { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.sheet { background: var(--paper); color: var(--paper-ink); box-shadow: var(--shadow); font: 10pt/1.36 Roboto, Arial, Helvetica, sans-serif; flex: none; white-space: pre-wrap; }
.sheet table.dt { border-collapse: collapse; width: 100%; table-layout: fixed; }
.sheet table.dt td { border: .75pt solid #000; padding: 2pt 4pt; vertical-align: top; overflow-wrap: anywhere; }
.sheet ol { margin: 0; padding-left: 16pt; }
.sheet ol li { padding-left: 2pt; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .9rem; font-weight: 500; max-width: min(92vw, 520px); box-shadow: var(--shadow); z-index: 10; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .18s ease-out; } }
#print-root { display: none; }
.sheet tr { break-inside: avoid; }
@media print {
  body { background: #fff !important; }
  #app, .toast { display: none !important; }
  #print-root { display: block; }
  #print-root .sheet { box-shadow: none; break-after: page; }
  #print-root .sheet:last-child { break-after: auto; }
}
@keyframes rise { from { opacity: .4; translate: 0 6px; } to { opacity: 1; translate: 0 0; } }
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="print-root"></div>

<script>
/*APP-START*/
(() => {
'use strict';

/* ---------- constants ---------- */
const app = document.getElementById('app');
const NB = ' ';
const DISTRICTS = ['Arevalo', 'City Proper', 'Jaro', 'La Paz', 'Lapuz', 'Mandurriao', 'Molo'];
const VTYPES = ['Multicab', 'Pickup', 'Van', 'Patrol vehicle', 'Ambulance / rescue vehicle', 'Motorcycle', 'Tricycle', 'Mini dump truck', 'Truck', 'Other'];
const POSITIONS = ['Punong Barangay', 'Barangay Kagawad', 'Barangay Secretary', 'Barangay Treasurer', 'SK Chairperson', 'Chief Tanod'];
const CONDITIONS = ['Serviceable', 'Under repair', 'Unserviceable'];
const CHECK_ITEMS = ['Body and paint', 'Windshield, windows and mirrors', 'Tires and spare tire', 'Engine', 'Brakes', 'Lights and horn', 'Battery', 'Seats and interior', 'Tools, jack and early warning device', 'Plates and "For Official Use Only" markings', 'Keys (all sets)', 'OR/CR and insurance papers'];
const CHECK_STATUS = ['OK', 'With defect', 'Missing', 'Not applicable'];
const TURN_TYPES = [['return', 'Return to the issuing office'], ['successor', 'Turnover to successor in office'], ['reassign', 'Reassignment to another official or barangay']];
const TURN_REASONS = ['End of term', 'Resignation', 'Suspension or removal from office', 'Recall by the owner', 'For repair', 'For disposal', 'Other'];
const TABS = [['registry', 'Vehicles'], ['receipts', 'Issuance'], ['trips', 'Trip tickets'], ['turnover', 'Turnover'], ['audit', 'Duplicate audit'], ['settings', 'Settings']];
const COL = { registry: 'vehicles', receipts: 'issuances', trips: 'trips', turnover: 'turnovers' };
const DEFAULTS = {
  header1: 'Republic of the Philippines', header2: 'City of Iloilo', lgu: 'City Government of Iloilo', place: 'Iloilo City',
  office: 'General Services Office', gsoName: '', gsoPosition: 'City General Services Officer',
  notedName: '', notedPosition: 'City Mayor', auditor: 'City Auditor', paper: 'A4', parTitle: 'PROPERTY ACKNOWLEDGMENT RECEIPT',
  legalBasis: 'Basis: Secs. 375 to 379, R.A. No. 7160 (Local Government Code); Secs. 101 to 105, P.D. No. 1445 (Government Auditing Code); COA Circular Nos. 75-6, 75-6A and 77-61.',
  extraTerms: ''
};

/* ---------- state ---------- */
const data = { vehicles: [], issuances: [], trips: [], turnovers: [], settings: { ...DEFAULTS } };
const ui = { tab: 'registry', mode: 'list', id: null, draft: null, q: '', flt: 'all', ready: false, shared: false, canWrite: true, confirm: null, editing: false, storeError: false, importPlan: null };
let db = null, downloads = null;
const LS = 'bva-records-v1';

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fmtDate = d => { if (!d) return ''; const x = new Date(d + 'T00:00:00'); return isNaN(x) ? String(d) : x.toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' }); };
const fmtTime = t => { if (!t) return ''; const [h, m] = String(t).split(':').map(Number); if (isNaN(h)) return String(t); return `${((h + 11) % 12) + 1}:${String(m || 0).padStart(2, '0')} ${h < 12 ? 'a.m.' : 'p.m.'}`; };
const fmtNum = n => Number(n).toLocaleString('en-PH', { maximumFractionDigits: 2 });
const fmtMoney = n => (n === '' || n == null || isNaN(Number(n))) ? '' : 'PHP ' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const U = (v, n = 14) => (v === '' || v == null) ? '_'.repeat(n) : String(v);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const veh = id => data.vehicles.find(v => v.id === id);
const activeIss = vid => data.issuances.find(i => i.vehicleId === vid && i.status !== 'closed');
const ownerName = v => v && v.ownerType === 'barangay' ? `Barangay ${U(v.barangay, 12)}` : data.settings.lgu;
const parName = () => String(data.settings.parTitle || DEFAULTS.parTitle).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
const ownerProse = v => v && v.ownerType === 'barangay' ? ownerName(v) : (/^the /i.test(data.settings.lgu) ? data.settings.lgu : 'the ' + data.settings.lgu);
const vehLabel = v => v ? ([v.yearModel, v.make, v.model].filter(Boolean).join(' ') || v.type || 'Vehicle') : 'Vehicle removed from registry';
const plateChip = v => v && v.plateNo ? `<span class="plate">${esc(v.plateNo)}</span>` : `<span class="plate none">No plate</span>`;
const byDateDesc = (k) => (a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b[k] || '').localeCompare(String(a[k] || ''));
const nextNo = (prefix, list, key, date) => {
  const y = (date || today()).slice(0, 4);
  const used = list.filter(r => String(r[key] || '').startsWith(`${prefix}-${y}-`)).map(r => parseInt(String(r[key]).split('-').pop(), 10) || 0);
  return `${prefix}-${y}-${String(Math.max(0, ...used) + 1).padStart(4, '0')}`;
};

const UNIQUE_VEHICLE_FIELDS = [
  ['plateNo', 'Plate No.'], ['engineNo', 'Engine No.'], ['chassisNo', 'Chassis No.'],
  ['mvFileNo', 'MV File No.'], ['crNo', 'CR No.'], ['propertyNo', 'Property No.']
];
const idKey = v => String(v || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
const exactKey = v => String(v || '').trim().toUpperCase();
function vehicleDuplicateConflicts(rec, ignoreId = null, list = data.vehicles) {
  const out = [];
  for (const [key, label] of UNIQUE_VEHICLE_FIELDS) {
    const val = idKey(rec[key]);
    if (!val) continue;
    const hit = list.find(v => v.id !== ignoreId && idKey(v[key]) === val);
    if (hit) out.push({ key, label, value: rec[key], hit });
  }
  return out;
}
function docDuplicate(list, key, value, ignoreId = null) {
  const k = idKey(value);
  return !!k && list.some(r => r.id !== ignoreId && idKey(r[key]) === k);
}
function duplicateGroups(list, key, label, formatter = r => r[key]) {
  const m = new Map();
  for (const r of list) {
    const k = key === 'vehicleId' ? String(r[key] || '') : idKey(r[key]);
    if (!k) continue;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  return [...m.values()].filter(g => g.length > 1).map(g => ({ label, value: formatter(g[0]), records: g }));
}
function auditDuplicates() {
  const groups = [];
  for (const [key, label] of UNIQUE_VEHICLE_FIELDS) groups.push(...duplicateGroups(data.vehicles, key, label));
  groups.push(...duplicateGroups(data.issuances, 'parNo', 'PAR No.'));
  groups.push(...duplicateGroups(data.trips, 'ticketNo', 'Trip Ticket No.'));
  groups.push(...duplicateGroups(data.turnovers, 'docNo', 'Turnover Report No.'));
  const active = data.issuances.filter(i => i.status !== 'closed');
  groups.push(...duplicateGroups(active, 'vehicleId', 'Multiple active issuances', r => { const v = veh(r.vehicleId); return v ? `${v.plateNo || 'No plate'} · ${vehLabel(v)}` : r.vehicleId; }));
  return groups;
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4200);
}

/* ---------- storage ---------- */
function loadLocal() {
  try {
    const j = JSON.parse(localStorage.getItem(LS) || 'null');
    if (j) { for (const k of ['vehicles', 'issuances', 'trips', 'turnovers']) if (Array.isArray(j[k])) data[k] = j[k]; data.settings = { ...DEFAULTS, ...(j.settings || {}) }; }
  } catch (e) { /* storage unavailable: keep records in memory */ }
}
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(data)); } catch (e) { /* in-memory only */ } }
function upsertLocal(col, rec) { const i = data[col].findIndex(r => r.id === rec.id); if (i >= 0) data[col][i] = rec; else data[col] = [...data[col], rec]; }
async function put(col, rec) {
  const id = rec.id || newId();
  const body = { ...rec, updatedAt: new Date().toISOString() }; delete body.id;
  if (db) await db.collection(col).doc(id).set(body);
  upsertLocal(col, { ...body, id });
  if (!db) saveLocal();
  return id;
}
async function del(col, id) {
  if (db) await db.collection(col).doc(id).delete();
  data[col] = data[col].filter(r => r.id !== id);
  if (!db) saveLocal();
}
async function putSettings(s) {
  if (db) await db.doc('config/settings').set(s);
  data.settings = { ...DEFAULTS, ...s };
  if (!db) saveLocal();
}
function writeFailed(e) {
  const code = e && e.code;
  if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') { ui.canWrite = false; return 'This record was not saved. Your access to this page is view-only.'; }
  if (code === 'quota_exceeded') return 'This record was not saved. The record store is full. Delete old trip tickets, then try again.';
  return 'This record was not saved. Check your connection, then try again.';
}

async function boot() {
  try { const h = (location.hash || '').slice(1); if (TABS.some(t => t[0] === h)) ui.tab = h; } catch (e) { /* no hash */ }
  render();
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { loadLocal(); ui.ready = true; render(); return; }
  const safe = n => Promise.resolve().then(() => c.use(n)).catch(() => null);
  const [d, dl, user] = await Promise.all([safe('db'), safe('downloads'), safe('user')]);
  downloads = dl;
  if (!d) { loadLocal(); ui.ready = true; render(); return; }
  db = d; ui.shared = true;
  try { if (user && (await user.can('data.write')) === false) ui.canWrite = false; } catch (e) { /* unknown: keep inputs */ }
  const loaded = new Set();
  setTimeout(() => { if (!ui.ready) { ui.ready = true; ui.storeError = loaded.size < 5; onData(); } }, 12000);
  const mark = n => { loaded.add(n); if (loaded.size >= 5) ui.ready = true; onData(); };
  const sub = (name, q) => q.onSnapshot(
    s => { data[name] = s.docs.map(x => ({ ...x.data(), id: x.id })); mark(name); },
    () => { ui.storeError = true; mark(name); });
  sub('vehicles', db.collection('vehicles'));
  sub('issuances', db.collection('issuances'));
  sub('turnovers', db.collection('turnovers'));
  sub('trips', db.collection('trips').orderBy('date', 'desc').limit(500));
  db.doc('config/settings').onSnapshot(
    s => { data.settings = { ...DEFAULTS, ...(s.exists ? s.data() : {}) }; mark('settings'); },
    () => { ui.storeError = true; mark('settings'); });
}
function onData() { if (!ui.editing) render(); }

/* ---------- document builders (pdfmake definitions; the preview renders the same tree) ---------- */
const T = (text, o) => ({ text: (text === '' || text == null) ? NB : text, ...o });
const nob = [false, false, false, false], bot = [false, false, false, true];
function pageDims(landscape) {
  const p = data.settings.paper;
  const d = p === 'Legal' ? [612, 936] : p === 'Letter' ? [612, 792] : [595.28, 841.89];
  return landscape ? { width: d[1], height: d[0] } : { width: d[0], height: d[1] };
}
function wrapDoc(content, title, landscape) {
  return {
    info: { title }, pageSize: pageDims(landscape), pageMargins: [42, 40, 42, 46],
    defaultStyle: { fontSize: 10, lineHeight: 1.15 }, content,

function cellText(val) {
  if (val instanceof Date) { const d = new Date(val.getTime() + 12 * 3600 * 1000); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

}
async function readImport(file) {
  await loadXlsx();
  const X = window.XLSX, wb = X.read(await file.arrayBuffer(), { cellDates: true });
  const ws = wb.Sheets.Vehicles || wb.Sheets[wb.SheetNames[0]];
  const rows = X.utils.sheet_to_json(ws, { defval: '' });
  const norm = h => String(h).toLowerCase().replace(/[^a-z0-9]/g, '');
  const map = Object.fromEntries(VCOLS.map(([h, k]) => [norm(h), k]));
  Object.assign(map, { plate: 'plateNo', platenumber: 'plateNo', engine: 'engineNo', enginenumber: 'engineNo', chassis: 'chassisNo', chassisnumber: 'chassisNo', brand: 'make', year: 'yearModel', owner: 'ownerType', propertynumber: 'propertyNo', dateofacquisition: 'acquisitionDate', cost: 'acquisitionCost', amount: 'acquisitionCost', typeofvehicle: 'type', brgy: 'barangay', fundsource: 'fundSource' });
  const adds = [], updates = []; let skipped = 0;
  for (const row of rows) {
    const o = {};
    for (const [h, val] of Object.entries(row)) { const k = map[norm(h)]; if (k) o[k] = cellText(val); }
    for (const [k] of UNIQUE_VEHICLE_FIELDS) if (o[k]) o[k] = String(o[k]).trim().toUpperCase();
    if (o.barangay) o.barangay = o.barangay.replace(/^(brgy\.?|barangay)\s+/i, '');
    if (o.ownerType) o.ownerType = /barangay|brgy/i.test(o.ownerType) ? 'barangay' : 'city';
    if (o.acquisitionDate && !/^\d{4}-\d{2}-\d{2}$/.test(o.acquisitionDate)) { const d = new Date(o.acquisitionDate); o.acquisitionDate = isNaN(d) ? '' : cellText(d); }
    if (o.acquisitionCost) o.acquisitionCost = String(o.acquisitionCost).replace(/[^0-9.]/g, '');
    if (!UNIQUE_VEHICLE_FIELDS.some(([k]) => o[k])) { if (Object.values(o).some(Boolean)) skipped++; continue; }
    const pending = [...adds, ...updates];
    if (vehicleDuplicateConflicts(o, null, pending).length) { skipped++; continue; }
    const matches = data.vehicles.filter(v => UNIQUE_VEHICLE_FIELDS.some(([k]) => o[k] && idKey(o[k]) === idKey(v[k])));
    const uniqueMatches = [...new Map(matches.map(v => [v.id, v])).values()];
    if (uniqueMatches.length > 1) { skipped++; continue; }
    const ex = uniqueMatches[0] || null;
    delete o.id;
    if (ex) {
      const candidate = { ...ex, ...Object.fromEntries(Object.entries(o).filter(([, v]) => v !== '')) };
      if (vehicleDuplicateConflicts(candidate, ex.id).length) { skipped++; continue; }
      const ch = {}; for (const [k, v] of Object.entries(o)) if (v !== '' && String(ex[k] ?? '') !== v) ch[k] = v;
      if (Object.keys(ch).length) updates.push({ ...ex, ...ch });
    } else adds.push({ ownerType: 'city', condition: 'Serviceable', type: 'Other', ...Object.fromEntries(Object.entries(o).filter(([, v]) => v !== '')) });
  }
  return { adds, updates, skipped, name: file.name, total: rows.length };
}

function registryRows() {
  const q = ui.q.trim().toLowerCase();
  const rows = sortedVehicles().filter(v => {
    const i = activeIss(v.id);
    if (ui.flt === 'issued' && !i) return false;
    if (ui.flt === 'unassigned' && i) return false;
    if (ui.flt === 'down' && (!v.condition || v.condition === 'Serviceable')) return false;
    if (!q) return true;
    return [v.plateNo, v.make, v.model, v.type, v.propertyNo, v.barangay, v.district, v.engineNo, v.chassisNo, i && i.officialName, i && i.parNo].some(x => String(x || '').toLowerCase().includes(q));

/* ---------- actions ---------- */
function go(tab, mode = 'list', id = null, draft = null) {
  ui.tab = tab; ui.mode = mode; ui.id = id; ui.draft = draft; ui.confirm = null;
  try { history.replaceState(null, '', '#' + tab); } catch (e) { /* hash not writable here */ }
  render();
  try { window.scrollTo(0, 0); } catch (e) { /* no-op */ }
}
function newDraft(tab, vehicleId) {
  const s = data.settings, v = veh(vehicleId), i = v && activeIss(v.id), city = !v || v.ownerType !== 'barangay';
  if (tab === 'registry') return { ownerType: 'city', condition: 'Serviceable', type: 'Multicab' };
  if (tab === 'receipts') return { vehicleId: vehicleId || '', parNo: nextNo('PAR', data.issuances, 'parNo'), date: today(), position: 'Punong Barangay', barangay: v ? v.barangay : '',
    issuedByName: city ? s.gsoName : '', issuedByPosition: city ? s.gsoPosition : 'Barangay Treasurer', notedName: city ? s.notedName : '', notedPosition: city ? s.notedPosition : 'Punong Barangay' };
  if (tab === 'trips') return { vehicleId: vehicleId || '', ticketNo: nextNo('TT', data.trips, 'ticketNo'), date: today(), driver: i ? String(i.drivers || '').split(/[,;(]/)[0].trim() : '', authName: i ? i.officialName : '', authPosition: i ? i.position : '' };
  return { vehicleId: vehicleId || '', docNo: nextNo('VTR', data.turnovers, 'docNo'), date: today(), type: 'return', reason: 'End of term', condition: v && v.condition || 'Serviceable',
    fromName: i ? i.officialName : '', fromPosition: i ? i.position : '', fromOffice: i && i.barangay ? 'Barangay ' + i.barangay : '',
    toName: s.gsoName, toPosition: s.gsoPosition, toOffice: s.office, inspName: '', inspPosition: '' };
}
function showErr(msg) { const e = document.getElementById('form-err'); if (e) { e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: 'nearest' }); } else toast(msg); }
function onVehicleChange(form) {
  const v = veh(form.elements.vehicleId.value); if (!v) return;
  const i = activeIss(v.id), set = (n, val) => { const el = form.elements[n]; if (el && !el.value && val) el.value = val; };
  if (ui.tab === 'receipts') set('barangay', v.barangay);
  if (ui.tab === 'trips' && i) { set('authName', i.officialName); set('authPosition', i.position); set('driver', String(i.drivers || '').split(/[,;(]/)[0].trim()); }
  if (ui.tab === 'turnover' && i) { set('fromName', i.officialName); set('fromPosition', i.position); set('fromOffice', i.barangay ? 'Barangay ' + i.barangay : ''); }
}

const actions = {
  tab: (id, b) => go(b.dataset.tab),
  new: (id, b) => go(b.dataset.tab, 'form', null, newDraft(b.dataset.tab)),
  start: (id, b) => go(b.dataset.tab, 'form', null, newDraft(b.dataset.tab, id)),
  open: (id, b) => go(b.dataset.tab, 'doc', id),
  edit: (id, b) => { const tab = b.dataset.tab, r = data[COL[tab]].find(x => x.id === id); if (r) go(tab, 'form', id, { ...r }); },
  cancel: () => (ui.id && ui.tab !== 'registry') ? go(ui.tab, 'doc', ui.id) : go(ui.tab),
  back: () => go(ui.tab),
  delete: id => { ui.confirm = id; render(); },
  'delete-no': () => { ui.confirm = null; render(); },
  'delete-yes': async id => {
    const tab = ui.tab, col = COL[tab];
    try {
      if (tab === 'turnover') {
        const iss = data.issuances.find(i => i.closedById === id);
        if (iss && !activeIss(iss.vehicleId)) { const { closedDate, closedBy, closedById, ...rest } = iss; await put('issuances', { ...rest, status: 'active' }); }
      }
      await del(col, id); toast('Record deleted.'); go(tab);
    } catch (e) { toast(writeFailed(e)); render(); }
  },
  'veh-delete-yes': async id => {
    const used = data.issuances.some(r => r.vehicleId === id) || data.trips.some(r => r.vehicleId === id) || data.turnovers.some(r => r.vehicleId === id);
    if (used) { ui.confirm = null; render(); toast('This vehicle has receipts, trip tickets or turnover reports. Delete those records first.'); return; }
    try { await del('vehicles', id); toast('Vehicle removed.'); go('registry'); } catch (e) { toast(writeFailed(e)); }
  },
  'veh-quick-delete': async id => {
    const v = veh(id); if (!v) return;
    if (!confirm(`Remove ${v.plateNo || vehLabel(v)} from the registry?`)) return;
    const used = data.issuances.some(r => r.vehicleId === id) || data.trips.some(r => r.vehicleId === id) || data.turnovers.some(r => r.vehicleId === id);
    if (used) { toast('This vehicle has linked receipts, trip tickets or turnover reports. Delete those records first.'); return; }
    try { await del('vehicles', id); toast('Vehicle removed.'); render(); } catch (e) { toast(writeFailed(e)); }
  },
  'quick-delete': async (id, b) => {
    const tab = b.dataset.tab || ui.tab, col = COL[tab], r = data[col] && data[col].find(x => x.id === id);
    if (!r) return;
    const label = r.parNo || r.ticketNo || r.docNo || 'this record';
    if (!confirm(`Delete ${label}? This cannot be undone.`)) return;
    try {
      if (tab === 'turnover') {
        const iss = data.issuances.find(i => i.closedById === id);
        if (iss && !activeIss(iss.vehicleId)) { const { closedDate, closedBy, closedById, ...rest } = iss; await put('issuances', { ...rest, status: 'active' }); }
      }
      await del(col, id); toast('Record deleted.'); render();
    } catch (e) { toast(writeFailed(e)); }
  },
  'receipt-from-turnover': id => {
    const r = data.turnovers.find(x => x.id === id); if (!r) return;
    const d = newDraft('receipts', r.vehicleId);
    go('receipts', 'form', null, { ...d, officialName: r.toName || '', position: r.toPosition || d.position, odometer: r.odometer || '' });
  },
  pdf: (id, b) => { const tab = ui.tab, r = data[COL[tab]].find(x => x.id === id); if (!r) return; const v = veh(r.vehicleId); offer(`${fileSafe(r[FILEKEY[tab]])}${v && v.plateNo ? '_' + fileSafe(v.plateNo) : ''}.pdf`, () => pdfBlob(BUILD[tab](r)), b); },
  blank: (id, b) => offer(`${BLANKNAME[ui.tab]}.pdf`, () => pdfBlob(BUILD[ui.tab]({})), b),
  inventory: (id, b) => offer(`Vehicle-Inventory_${today()}.pdf`, () => pdfBlob(inventoryDoc()), b),
  xlsx: (id, b) => offer(`Barangay-Vehicle-Records_${today()}.xlsx`, xlsxBlob, b),
  print: id => { const r = data[COL[ui.tab]].find(x => x.id === id); if (r) printDoc(BUILD[ui.tab](r)); },
  'print-blank': () => printDoc(BUILD[ui.tab]({})),
  'print-inventory': () => printDoc(inventoryDoc()),
  import: () => { const i = document.getElementById('imp'); if (i) { i.value = ''; i.click(); } },
  'import-no': () => { ui.importPlan = null; render(); },
  'import-yes': async (id, b) => {
    const p = ui.importPlan; if (!p) return;
    b.disabled = true; b.textContent = 'Importing…';
    let done = 0;
    try { for (const v of [...p.adds, ...p.updates]) { await put('vehicles', v); done++; } toast(`${done} ${done === 1 ? 'vehicle' : 'vehicles'} imported.`); }
    catch (e) { toast(`${done} imported, then stopped. ${writeFailed(e)}`); }
    ui.importPlan = null; go('registry');
  }
};

const submitters = {
  async registry(f) {
    const o = Object.fromEntries(new FormData(f));
    for (const [k] of UNIQUE_VEHICLE_FIELDS) o[k] = String(o[k] || '').trim().toUpperCase();
    o.barangay = String(o.barangay || '').trim().replace(/^(brgy\.?|barangay)\s+/i, '');
    const conflicts = vehicleDuplicateConflicts(o, ui.id);
    if (conflicts.length) {
      const c = conflicts[0];
      return showErr(`${c.label} ${o[c.key]} is already used by ${c.hit.plateNo || vehLabel(c.hit)}. Duplicate vehicle identifiers are not allowed.`);
    }
    const old = ui.id ? veh(ui.id) : {};
    await put('vehicles', { ...old, ...o, ...(ui.id ? { id: ui.id } : {}) });
    toast(ui.id ? 'Vehicle saved.' : 'Vehicle added.'); go('registry');
  },
  async receipts(f) {
    const o = Object.fromEntries(new FormData(f));
    o.barangay = String(o.barangay || '').trim().replace(/^(brgy\.?|barangay)\s+/i, '');
    const other = data.issuances.find(i => i.vehicleId === o.vehicleId && i.status !== 'closed' && i.id !== ui.id);
    const old = ui.id ? data.issuances.find(i => i.id === ui.id) : null;
    if (other && (!old || old.status !== 'closed')) return showErr(`This vehicle is still issued to ${other.officialName || 'another official'} under ${other.parNo || 'an active receipt'}. Record its turnover first.`);
    o.parNo = String(o.parNo || '').trim().toUpperCase();
    if (docDuplicate(data.issuances, 'parNo', o.parNo, ui.id)) return showErr(`PAR No. ${o.parNo} is already used. Enter a different number.`);
    const id = await put('issuances', { ...(old || { status: 'active' }), ...o, ...(ui.id ? { id: ui.id } : {}) });
    toast(ui.id ? 'Receipt saved.' : 'Receipt issued.'); go('receipts', 'doc', id);
  },
  async trips(f) {
    const o = Object.fromEntries(new FormData(f));
    o.ticketNo = String(o.ticketNo || '').trim().toUpperCase();
    if (docDuplicate(data.trips, 'ticketNo', o.ticketNo, ui.id)) return showErr(`Trip Ticket No. ${o.ticketNo} is already used. Enter a different number.`);
    if (o.odoStart !== '' && o.odoEnd !== '' && Number(o.odoEnd) < Number(o.odoStart)) return showErr('The odometer reading at the end is lower than the reading at the start.');
    const old = ui.id ? data.trips.find(i => i.id === ui.id) : {};
    const id = await put('trips', { ...old, ...o, ...(ui.id ? { id: ui.id } : {}) });
    toast('Trip ticket saved.'); go('trips', 'doc', id);
  },
  async turnover(f) {
    const raw = Object.fromEntries(new FormData(f)), o = {};
    for (const [k, v] of Object.entries(raw)) if (!/^(chk|note)\d+$/.test(k)) o[k] = v;
    o.checks = CHECK_ITEMS.map((item, n) => ({ item, status: raw['chk' + n] || '', note: raw['note' + n] || '' }));
    o.docNo = String(o.docNo || '').trim().toUpperCase();
    const old = ui.id ? data.turnovers.find(i => i.id === ui.id) : null;
    const iss = old ? null : activeIss(o.vehicleId);
    if (!old && !iss) return showErr('This vehicle has no active receipt to close. Issue a receipt first, or choose another vehicle.');
    if (docDuplicate(data.turnovers, 'docNo', o.docNo, ui.id)) return showErr(`Report No. ${o.docNo} is already used. Enter a different number.`);
    if (iss) o.parNo = iss.parNo || '';
    const id = await put('turnovers', { ...(old || {}), ...o, ...(ui.id ? { id: ui.id } : {}) });
    if (iss) await put('issuances', { ...iss, status: 'closed', closedDate: o.date, closedBy: o.docNo, closedById: id });
    const v = veh(o.vehicleId);
    if (v && o.condition && v.condition !== o.condition) await put('vehicles', { ...v, condition: o.condition });
    toast(iss ? `Turnover saved. ${iss.parNo || 'The receipt'} is now closed.` : 'Turnover report saved.'); go('turnover', 'doc', id);
  },
  async settings(f) {
    const o = Object.fromEntries(new FormData(f));
    await putSettings({ ...data.settings, ...o });
    toast('Settings saved.'); render();
  }
};

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = actions[b.dataset.act]; if (fn) fn(b.dataset.id, b);
});
app.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, fn = submitters[f.dataset.form]; if (!fn) return;
  const btn = f.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
  try { await fn(f); } catch (err) { showErr(writeFailed(err)); }
  if (btn && btn.isConnected) btn.disabled = false;
});
app.addEventListener('input', e => { if (e.target.id === 'q') { ui.q = e.target.value; const r = document.getElementById('rows'); if (r) r.innerHTML = registryRows(); } });
app.addEventListener('change', e => {
  if (e.target.id === 'flt') { ui.flt = e.target.value; const r = document.getElementById('rows'); if (r) r.innerHTML = registryRows(); }
  if (e.target.name === 'vehicleId' && e.target.form) onVehicleChange(e.target.form);
  if (e.target.id === 'imp' && e.target.files && e.target.files[0]) {
    readImport(e.target.files[0]).then(p => { ui.importPlan = p; go('registry'); })
      .catch(() => toast('That file could not be read. Use an Excel (.xlsx) or CSV file with one vehicle per row.'));
  }
});

boot();
})();
/*APP-END*/
</script>

</body></html>
